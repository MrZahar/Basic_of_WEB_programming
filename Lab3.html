<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Lab3.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <p class="action">FEED YOUR SUPERHERO</p>
            <h1>Super Healthy Lunches for Picky Eaters.</h1>
            <p class="info-about">Freshly cooked lunches delivered to schools and camps daily.</p>
            <button class="start-now">Start Now • $9.99 per Lunch</button>
        </div>
    </header>
    <main>
        <section class="offer">
            <div class="container">
                <div class="lunch-description">
                    <div class="lunch-photo">
                        <img src="images/Lunch2.png">
                        <div class="rectangle"></div>
                    </div>
                    <div class="text-description">
                        <p class="lunch-name">The Superhero Box</p>
                        <p class="name">Super Healthy School Lunches</p>
                        <p class="cost">$49.99</p>
                        <div class="marks">
                            <div class="average-mark">
                                <img src="images/star.svg">
                                <img src="images/star.svg">
                                <img src="images/star.svg">
                                <img src="images/star.svg">
                                <img src="images/star.svg">
                            </div>    
                            <p class="number-of-reviews">8 reviews</p>
                        </div>
                        <p class="choosing">Choose Quantity</p>
                        <a class="number-of-lunches" href="#">Full Week (5 Lunches)</a>
                        <a class="number-of-lunches" href="#">Half Week (3 Lunches)</a>
                    <div class="buttons">
                        <button class="amount">-+</button>
                        <button class="add-to-cart">Add to Cart</button>
                    </div>
                    <div class="social-media">
                        <div class="facebook">
                            <img src="images/facebook_icon.svg">
                            <p>Share on <br> Facebook</p>
                        </div>
                        <div class="facebook">
                            <img src="images/twitter_icon.svg">
                            <p>Share <br> on <br> Twitter</p>
                        </div>
                        <div class="facebook">
                            <img src="images/pin_icon.svg">
                            <p>Pin it</p>
                        </div>
                    </div>
                </div>              
            </div>
        </section>
        <section class="location">
            
        </section>
    </main>
</body>
</html>
